<html>
<head>

.bar{height:8px;background:#4ade80;border-radius:5px}
</style>

<body>

<div class="card">

<p>Why do our eyes dilate in dim light?</p>
<button>Play Now</button>
</div>
<h3>Choose Your Subject</h3>
<div class="card">Mathematics - 82% <div class="progress"><div class="bar" style="width:82%"></div></div></div>
<div class="card">Physics - 68% <div class="progress"><div class="bar" style="width:68%"></div></div></div>
<div class="card">Biology - 90% <div class="progress"><div class="bar" style="width:90%"></div></div></div>
</body>
</html>
